
name: ACR - Build and Push

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Autenticacion Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Autenticacion en ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Construir imagen Docker
        run: |
          docker build -t ${{ vars.ACR_NAME }}.azurecr.io/ingeniacyber:v1 .

      - name: Subir imagen al ACR
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/ingeniacyber:v1
