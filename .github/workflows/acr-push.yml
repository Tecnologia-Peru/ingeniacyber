
name: ACR - Build and Push

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-acr:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Autenticacion Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar identidad Azure
        run: az account show --output table

      - name: Autenticacion en ACR
        run: az acr login --name ${{ vars.ACR_NAME }}
